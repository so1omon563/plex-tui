[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plex-tui"
version = "0.1.0"
description = "A small standalone Plex terminal UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "plexapi>=4.15",
  "platformdirs>=4.2",
  "textual>=0.86",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
plex-tui = "plextui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plextui"]
