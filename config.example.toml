# Example config paths:
# macOS: ~/Library/Application Support/plex-tui/config.toml
# Linux: ~/.config/plex-tui/config.toml

base_url = "http://127.0.0.1:32400"
token = "your-plex-token"
client_identifier = "plex-tui-your-stable-client-id"

# Optional account token saved by Plex PIN login.
# account_token = "your-plex-account-token"
# Optional original Plex Home token saved after profile switching.
# home_account_token = "your-plex-home-account-token"
# Optional display label for the last active Plex Home profile.
# active_profile_title = "Owner"

# Optional stream preferences. Use Plex language codes when possible.
# preferred_audio_language = "jpn"
# preferred_subtitle_language = "eng"
# subtitle_mode can be "auto", "none", or "preferred".
# subtitle_mode = "preferred"
# Optional mpv window size passed as --autofit. Empty uses the app default
# "80%" for a more comfortable window on modern displays.
# Examples: "90%", "1280x720", "80%x80%".
# Existing exact-size overrides such as "1280x720" stay exact until reset or
# changed in Settings.
# mpv_window_size = "1280x720"
# playback_mode can be "auto" for direct/default playback or "transcode" to
# force Plex transcoding.
# playback_mode = "transcode"
# playback_display can be "external" for the normal mpv window or "terminal"
# for experimental terminal playback that prefers Kitty/Ghostty graphics and
# falls back to TCT text video. Terminal playback takes over the terminal until
# mpv exits.
# playback_display = "terminal"
# terminal_video_output can be "auto", "kitty", "sixel", "tct", or "drm".
# Auto prefers Kitty/Ghostty graphics when detected and falls back to TCT. DRM
# is for console sessions where mpv supports --vo=drm.
# terminal_video_output = "kitty"
# terminal_video_profile can be "smooth", "balanced", or "sharp". Smooth keeps
# the default frame payload small because terminal graphics can become choppy.
# Terminal playback forces Plex transcoding and uses 480p 2 Mbps when
# transcode_quality is "original"; non-original quality choices are respected.
# Terminal playback is experimental and will be worse than an external mpv
# window; keep playback_display external for normal watching.
# terminal_video_profile = "balanced"
# transcode_quality applies when playback_mode is "transcode". Values are
# "original", "1080p_8", "720p_4", or "480p_2".
# transcode_quality = "720p_4"
# Ask before starting from the beginning when selected media can resume.
# confirm_start_over = true

# Optional browsing performance settings.
# page_size controls how many Plex items each library/search request loads.
# page_size = 40
# auto_load_threshold controls how close to the end of loaded items selection
# must be before the next page is fetched automatically.
# auto_load_threshold = 10
# grid_prefetch_pages controls how many grid pages ahead poster artwork is
# prepared. Use 0 to fetch only the visible page.
# grid_prefetch_pages = 3
# hidden_library_keys hides noisy Plex libraries from the sidebar. Use Settings
# to toggle libraries after connecting, or list keys manually as comma-separated
# values.
# hidden_library_keys = "1,4"
# library_order_keys pins the sidebar order. Use Settings to move libraries
# after connecting, or list keys manually as comma-separated values.
# library_order_keys = "2,1,4"
# show_playlists, show_discover, and show_on_plex control optional sidebar entrypoints.
# show_playlists = true
# show_discover = true
# show_on_plex = true
# discover_media_type controls Plex Discover filtering: movies_shows, movie,
# show, or all. The default avoids noisy non-movie/show results.
# discover_media_type = "movies_shows"

# Optional artwork settings.
# artwork_mode can be "on" or "off".
# artwork_mode = "on"
# artwork_renderer can be "block", "auto", or "kitty". Auto uses Kitty graphics
# in detected compatible terminals such as Kitty and Ghostty, otherwise it falls
# back to block art. "kitty" explicitly tries the Kitty graphics protocol.
# artwork_renderer = "block"
# detail_artwork_mode can be "list_only", "on", or "off".
# detail_artwork_mode = "list_only"
# media_view can be "list" or "grid".
# media_view = "list"
# library_enter_action can be "library" or "browse_modes". The default
# "library" opens all items with Enter and uses Space for browse modes.
# "browse_modes" swaps those two actions.
# library_enter_action = "library"
# grid_density can be "compact", "comfortable", or "large".
# grid_density = "comfortable"
# Textual theme selected from the command palette.
# theme = "textual-dark"
