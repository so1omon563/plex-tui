name: Post-release Homebrew Publish

on:
  workflow_run:
    workflows: ["Version Bump and Release"]
    types: ["completed"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, such as v0.3.0. Defaults to the release created by the completed bump workflow."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  publish-tap:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check packaging PR token
        env:
          PACKAGING_PR_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PACKAGING_PR_TOKEN" ]; then
            echo "PACKAGING_PR_TOKEN secret is required to publish the Homebrew tap" >&2
            exit 1
          fi

          pr_query="$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              nameWithOwner
              pullRequests(first: 1) {
                totalCount
              }
            }
          }
          GRAPHQL
          )"

          gh api repos/so1omon563/homebrew-plex-tui --jq '.full_name' >/dev/null
          gh api graphql \
            -f owner=so1omon563 \
            -f name=homebrew-plex-tui \
            -f query="$pr_query" >/dev/null
          gh pr list --repo so1omon563/homebrew-plex-tui --limit 1 >/dev/null

      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like vX.Y.Z: $tag" >&2
            exit 1
          fi

          if ! gh release view "$tag" --json tagName --jq '.tagName' >/dev/null; then
            echo "GitHub Release does not exist for $tag" >&2
            exit 1
          fi

          if [ -n "$WORKFLOW_HEAD_SHA" ]; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_sha="$(git rev-list -n 1 "$tag")"
            workflow_sha="$WORKFLOW_HEAD_SHA"
            merge_sha="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null) | .merge_commit_sha][0] // ""')"
            if [ -n "$merge_sha" ]; then
              workflow_sha="$merge_sha"
            fi

            if [ "$tag_sha" != "$workflow_sha" ]; then
              {
                echo "publish=false"
              } >> "$GITHUB_OUTPUT"
              echo "Latest release $tag points at $tag_sha, not completed workflow SHA $workflow_sha. Nothing to publish."
              exit 0
            fi
          fi

          version="${tag#v}"
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Tap Homebrew repository
        if: steps.release.outputs.publish == 'true'
        id: tap
        env:
          PACKAGING_PR_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN }}
        run: |
          brew tap so1omon563/plex-tui "https://x-access-token:${PACKAGING_PR_TOKEN}@github.com/so1omon563/homebrew-plex-tui.git"
          echo "path=$(brew --repo so1omon563/plex-tui)" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI package availability
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if python -m pip install \
              --dry-run \
              --ignore-installed \
              --no-cache-dir \
              --disable-pip-version-check \
              "plex-tui==${VERSION}" >/dev/null 2>&1; then
              echo "plex-tui ${VERSION} is available from PyPI."
              exit 0
            fi

            echo "plex-tui ${VERSION} is not available from PyPI yet; retrying (${attempt}/60)."
            sleep 10
          done

          echo "plex-tui ${VERSION} did not become available from PyPI in time." >&2
          exit 1

      - name: Update formula source
        if: steps.release.outputs.publish == 'true'
        run: |
          python scripts/update_homebrew_formula.py \
            "${{ steps.tap.outputs.path }}/Formula/plex-tui.rb" \
            "${{ steps.release.outputs.version }}"

      - name: Check tap update need
        if: steps.release.outputs.publish == 'true'
        id: tap-update
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          bottle_release="plex-tui-${VERSION}"
          bottle_root_url="https://github.com/so1omon563/homebrew-plex-tui/releases/download/${bottle_release}"
          needed=false

          if ! git diff --quiet -- Formula/plex-tui.rb; then
            needed=true
          fi

          if ! grep -Fq "root_url \"${bottle_root_url}\"" Formula/plex-tui.rb; then
            needed=true
          fi

          {
            echo "needed=${needed}"
            echo "bottle_release=${bottle_release}"
            echo "bottle_root_url=${bottle_root_url}"
          } >> "$GITHUB_OUTPUT"

          if [ "$needed" = "false" ]; then
            echo "Homebrew tap is already up to date with bottle metadata."
          fi

      - name: Build Homebrew bottle
        if: steps.release.outputs.publish == 'true' && steps.tap-update.outputs.needed == 'true'
        id: bottle
        timeout-minutes: 60
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          BOTTLE_ROOT_URL: ${{ steps.tap-update.outputs.bottle_root_url }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          brew --version
          brew config
          brew info so1omon563/plex-tui/plex-tui

          (
            while true; do
              sleep 60
              echo "Still building Homebrew bottle for plex-tui ${VERSION} at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          brew uninstall --ignore-dependencies so1omon563/plex-tui/plex-tui >/dev/null 2>&1 || true
          brew install --verbose --build-bottle so1omon563/plex-tui/plex-tui
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

          rm -f plex-tui--*.bottle.json plex-tui--*.bottle.tar.gz
          brew bottle \
            --json \
            --no-rebuild \
            --root-url "$BOTTLE_ROOT_URL" \
            so1omon563/plex-tui/plex-tui

          bottle_json="$(find "$PWD" -maxdepth 1 -name 'plex-tui--*.bottle.json' -print -quit)"
          if [ -z "$bottle_json" ]; then
            echo "brew bottle did not produce bottle JSON" >&2
            exit 1
          fi

          bottle_dir="${RUNNER_TEMP}/homebrew-bottles"
          rm -rf "$bottle_dir"
          mkdir -p "$bottle_dir"
          python "${GITHUB_WORKSPACE}/scripts/prepare_homebrew_bottle_assets.py" \
            "$bottle_json" \
            --output-dir "$bottle_dir"

          brew bottle --merge --write --no-commit "$bottle_json"

          {
            echo "json_path=${bottle_json}"
            echo "upload_dir=${bottle_dir}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Homebrew bottle assets
        if: steps.release.outputs.publish == 'true' && steps.tap-update.outputs.needed == 'true'
        working-directory: ${{ steps.bottle.outputs.upload_dir }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          BOTTLE_RELEASE: ${{ steps.tap-update.outputs.bottle_release }}
        run: |
          set -euo pipefail

          if gh release view "$BOTTLE_RELEASE" --repo so1omon563/homebrew-plex-tui >/dev/null 2>&1; then
            gh release edit "$BOTTLE_RELEASE" \
              --repo so1omon563/homebrew-plex-tui \
              --title "plex-tui ${VERSION} Homebrew bottle"
          else
            gh release create "$BOTTLE_RELEASE" \
              --repo so1omon563/homebrew-plex-tui \
              --target main \
              --title "plex-tui ${VERSION} Homebrew bottle" \
              --notes "Homebrew bottle assets for plex-tui ${VERSION}."
          fi

          gh release upload "$BOTTLE_RELEASE" ./* \
            --repo so1omon563/homebrew-plex-tui \
            --clobber

      - name: Audit formula
        if: steps.release.outputs.publish == 'true' && steps.tap-update.outputs.needed == 'true'
        working-directory: ${{ steps.tap.outputs.path }}
        run: |
          brew audit --strict --online so1omon563/plex-tui/plex-tui

      - name: Commit tap update
        if: steps.release.outputs.publish == 'true' && steps.tap-update.outputs.needed == 'true'
        id: commit
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/plex-tui.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Homebrew tap is already up to date."
            exit 0
          fi

          branch="automation/plex-tui-v${VERSION}"
          formula_update="$(mktemp)"
          cp Formula/plex-tui.rb "$formula_update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            cp "$formula_update" Formula/plex-tui.rb
          else
            git switch -c "$branch"
          fi

          if ! git diff --quiet -- Formula/plex-tui.rb; then
            git add Formula/plex-tui.rb
            git commit -m "Update plex-tui to ${VERSION}"
          fi
          git push origin "$branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open and merge tap pull request
        if: steps.release.outputs.publish == 'true' && steps.commit.outputs.changed == 'true'
        working-directory: ${{ steps.tap.outputs.path }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_PR_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BOTTLE_RELEASE: ${{ steps.tap-update.outputs.bottle_release }}
        run: |
          set -euo pipefail

          pr_body="$(printf 'Automated Homebrew tap update for plex-tui %s.\n\nIncludes the generated bottle metadata for %s.\n' "$VERSION" "$BOTTLE_RELEASE")"

          pr_url="$(gh pr list \
            --repo so1omon563/homebrew-plex-tui \
            --head "$BRANCH" \
            --json url \
            --jq '.[0].url // ""')"

          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --repo so1omon563/homebrew-plex-tui \
              --base main \
              --head "$BRANCH" \
              --title "Update plex-tui to ${VERSION}" \
              --body "$pr_body")"
          fi

          gh pr merge "$pr_url" \
            --repo so1omon563/homebrew-plex-tui \
            --squash \
            --delete-branch
